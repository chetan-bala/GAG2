<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GAG2 Live Tracker</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config={
  darkMode:'class',
  theme:{
    extend:{
      colors:{surface:'#13161c',border:'#1e2230',muted:'#7b8299',seed:'#10b981',gear:'#0ea5e9',crate:'#f97316'}
    }
  }
}
</script>
<style>
body{background:#0b0d11;color:#e8edf5;font-family:system-ui,sans-serif;min-height:100vh}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#1e2230;border-radius:3px}
@keyframes pulse-dot{0%,100%{opacity:1}50%{opacity:.3}}
.live-dot{animation:pulse-dot 2s ease-in-out infinite}
@keyframes fade-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.fade-in{animation:fade-in .3s ease-out}
</style>
</head>
<body class="flex flex-col min-h-screen dark">
<div id="app">
  <header class="bg-surface border-b border-border px-4 sm:px-6 py-3 flex items-center justify-between flex-wrap gap-2">
    <div class="flex items-center gap-3">
      <h1 class="text-lg font-extrabold tracking-tight">
        <span class="bg-gradient-to-r from-seed via-gear to-crate bg-clip-text text-transparent">GAG2</span>
        <span class="text-white"> Live Tracker</span>
      </h1>
      <span id="status-badge" class="inline-flex items-center gap-1.5 text-xs font-semibold px-3 py-1 rounded-full bg-red-500/10 text-red-400 border border-red-500/25">
        <span class="w-1.5 h-1.5 rounded-full bg-red-400"></span>OFFLINE
      </span>
    </div>
    <div class="flex items-center gap-3 text-xs text-muted">
      <span id="countdown"></span>
      <button id="notif-btn" onclick="toggleNotif()" class="px-3 py-1.5 rounded-lg border border-border hover:bg-white/5">🔕 Off</button>
    </div>
  </header>

  <main class="flex-1 max-w-6xl mx-auto w-full px-4 py-6 space-y-6">
    <div id="weather-bar"></div>
    <div id="moons"></div>

    <div class="flex gap-2 flex-wrap">
      <input id="search" type="text" placeholder="Search items..." oninput="render()" class="flex-1 min-w-[200px] bg-surface border border-border rounded-lg px-3 py-2 text-sm placeholder-muted focus:outline-none focus:border-seed/50">
      <select id="filter" onchange="render()" class="bg-surface border border-border rounded-lg px-3 py-2 text-sm">
        <option value="all">All</option>
        <option value="seed">Seed</option>
        <option value="gear">Gear</option>
        <option value="crate">Crates</option>
      </select>
    </div>

    <div id="sell-panel"></div>
    <div id="stock-container" class="space-y-4"></div>
    <div id="history-container"></div>
  </main>

  <footer class="text-center py-4 text-xs text-muted border-t border-border">
    Data from <a href="https://gag2.gg" class="text-gear hover:underline" target="_blank">gag2.gg</a>
  </footer>
</div>

<script>
const RARITY_COLORS={common:'#94a3b8',uncommon:'#34d399',rare:'#38bdf8',super:'#38bdf8',epic:'#a78bfa',legendary:'#fbbf24',mythic:'#e879f9',divine:'#22d3ee'}
const CATEGORIES={seed:{label:'Seed Shop',color:'#10b981',icon:'🌱'},gear:{label:'Gear Shop',color:'#0ea5e9',icon:'🔧'},crate:{label:'Crates',color:'#f97316',icon:'📦'}}
let data=null, connected=false, history=[], notifOn=false

function countdown(target) {
  if(!target) return '—'
  const ms=new Date(target).getTime()-Date.now()
  if(ms<=0) return 'Now'
  const s=Math.floor(ms/1000), m=Math.floor(s/60), h=Math.floor(m/60)
  return h>0?h+'h '+m%60+'m':m>0?m+'m '+s%60+'s':s+'s'
}
setInterval(()=>{
  document.querySelectorAll('[data-countdown]').forEach(el=>{
    el.textContent=countdown(el.dataset.countdown)
  })
},1000)

function toggleNotif() {
  notifOn=!notifOn
  document.getElementById('notif-btn').textContent=notifOn?'🔔 On':'🔕 Off'
  if(notifOn && 'Notification' in window && Notification.permission==='default') Notification.requestPermission()
}

let prevChecksum=''
function checksum(d) {
  let p=[]
  for(const c of d?.stock||[]) for(const i of c?.items||[]) p.push(i.key+':'+i.quantity)
  return p.join(',')
}
function checkChange(d) {
  const cs=checksum(d)
  if(prevChecksum && cs!==prevChecksum && notifOn && 'Notification' in window && Notification.permission==='granted') {
    new Notification('GAG2 Stock Changed!',{body:'Stock quantities have changed.'})
  }
  prevChecksum=cs
}

// WebSocket
;(function connect(){
  const proto=location.protocol==='https:'?'wss':'ws'
  const host=location.host
  const ws=new WebSocket(proto+'://'+host+'/ws')
  ws.onopen=()=>{connected=true;document.getElementById('status-badge').innerHTML='<span class="w-1.5 h-1.5 rounded-full bg-seed live-dot"></span>LIVE';document.getElementById('status-badge').className='inline-flex items-center gap-1.5 text-xs font-semibold px-3 py-1 rounded-full bg-seed/10 text-seed border border-seed/25'}
  ws.onmessage=e=>{
    try{
      const d=JSON.parse(e.data)
      checkChange(d)
      data=d
      render()
    }catch(ex){console.error(ex)}
  }
  ws.onclose=()=>{connected=false;setTimeout(connect,2000)}
  ws.onerror=()=>ws.close()
})();

// Fetch history
async function loadHistory(){
  try{
    const r=await fetch('/api/history?limit=30')
    history=await r.json()
    render()
  }catch{}
}
loadHistory()

function render(){
  if(!data) return
  const search=document.getElementById('search').value.toLowerCase()
  const filter=document.getElementById('filter').value

  // Weather
  const wb=document.getElementById('weather-bar')
  if(data.weather?.current){
    wb.innerHTML='<div class="bg-surface border border-border rounded-xl px-4 py-3 flex items-center gap-3 fade-in">'+
      '<span class="text-2xl">'+data.weather.current.emoji+'</span>'+
      '<div class="flex-1"><div class="font-semibold text-sm">'+data.weather.current.name+'</div><div class="text-xs text-muted">'+data.weather.current.blurb+'</div></div>'+
      '<div class="text-xs text-right text-muted">Ends <span data-countdown="'+data.weather.current.endsAt+'">'+countdown(data.weather.current.endsAt)+'</span></div></div>'
  } else { wb.innerHTML='' }

  // Moons
  const mb=document.getElementById('moons')
  if(data.weather?.upcomingMoons?.length){
    const icons={'Rainbow Moon':'🌈','Mega Moon':'🟣','Bloodmoon':'🔴','Goldmoon':'🟡'}
    mb.innerHTML='<div class="bg-surface border border-border rounded-xl p-4"><h3 class="text-xs font-semibold text-muted uppercase tracking-wider mb-3">Upcoming Moons</h3><div class="flex gap-2 overflow-x-auto">'+
      data.weather.upcomingMoons.slice(0,8).map(m=>{
        const icon=Object.entries(icons).find(([k])=>m.name.includes(k))?.[1]||'🌙'
        return '<div class="flex-shrink-0 bg-white/[0.03] rounded-lg px-3 py-2 text-center min-w-[90px]"><div class="text-lg">'+icon+'</div><div class="text-[10px] text-muted mt-1">'+countdown(new Date(m.boundary*1000).toISOString())+'</div></div>'
      }).join('')+'</div></div>'
  } else { mb.innerHTML='' }

  // Sell multipliers
  const sp=document.getElementById('sell-panel')
  if(data.sell?.entries?.length){
    sp.innerHTML='<details class="bg-surface border border-border rounded-xl"><summary class="px-4 py-3 cursor-pointer text-sm font-semibold hover:bg-white/[0.02] rounded-xl">Sell Price Multipliers ('+data.sell.entries.length+' items)</summary><div class="px-4 pb-3 max-h-60 overflow-y-auto"><div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-1.5 text-xs">'+
      data.sell.entries.map(e=>'<div class="flex justify-between bg-white/[0.02] px-2 py-1 rounded"><span>'+e.name+'</span><span class="'+(e.multiplier>=1?'text-seed':'text-red-400')+'">&times;'+e.multiplier.toFixed(2)+'</span></div>').join('')+
      '</div></div></details>'
  } else { sp.innerHTML='' }

  // Stock
  const sc=document.getElementById('stock-container')
  const filtered=[]
  for(const cat of data.stock||[]){
    const items=(cat.items||[]).filter(i=>
      (filter==='all'||cat.category===filter) &&
      (i.name.toLowerCase().includes(search)||i.rarity?.toLowerCase().includes(search))
    )
    if(items.length) filtered.push({...cat,items})
  }
  if(!filtered.length && data.stock){
    sc.innerHTML='<div class="text-center text-muted py-12 text-sm">No items match your search.</div>'
  } else {
    sc.innerHTML=filtered.map(cat=>{
      const c=CATEGORIES[cat.category]||{label:cat.category,color:'#6b7280',icon:'📦'}
      const nr=cat.nextRestockAt
      return '<div class="bg-surface border border-border rounded-xl overflow-hidden fade-in">'+
        '<div class="flex items-center justify-between px-4 py-3 border-b border-border" style="border-left-color:'+c.color+';border-left-width:3px">'+
        '<h2 class="font-bold text-sm flex items-center gap-2"><span style="color:'+c.color+'">'+c.icon+'</span>'+c.label+'</h2>'+
        '<div class="text-xs text-muted text-right"><div class="font-medium" style="color:'+c.color+'">Restock <span data-countdown="'+nr+'">'+countdown(nr)+'</span></div></div></div>'+
        '<div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-1.5 p-3">'+
        cat.items.map(i=>{
          const rc=RARITY_COLORS[i.rarity?.toLowerCase()]||'#666'
          return '<div class="flex items-center gap-2.5 bg-white/[0.03] rounded-lg px-3 py-2 hover:bg-white/[0.06] transition">'+
            '<span class="text-xl w-8 text-center flex-shrink-0">'+(i.emoji||'❓')+'</span>'+
            '<div class="flex-1 min-w-0"><div class="text-sm font-semibold truncate">'+i.name+'</div>'+
            (i.rarity?'<div class="text-[10px] font-bold uppercase tracking-wider" style="color:'+rc+'">'+i.rarity+'</div>':'')+'</div>'+
            '<div class="text-sm font-extrabold flex-shrink-0 px-2 py-0.5 rounded '+(i.quantity>0?'bg-seed/15 text-seed':'bg-red-500/10 text-red-400')+'">&times;'+i.quantity+'</div></div>'
        }).join('')+'</div></div>'
    }).join('')
  }

  // History
  const hc=document.getElementById('history-container')
  if(history.length){
    hc.innerHTML='<div class="bg-surface border border-border rounded-xl p-4"><h3 class="text-xs font-semibold text-muted uppercase tracking-wider mb-3">Recent Stock Changes</h3><div class="max-h-48 overflow-y-auto space-y-1 text-xs">'+
      history.slice(0,30).map(r=>'<div class="flex justify-between bg-white/[0.02] px-3 py-1.5 rounded"><span class="text-muted">'+(r.timestamp?.slice(0,19).replace('T',' ')||'')+'</span><span style="color:'+(RARITY_COLORS[r.rarity?.toLowerCase()]||'#666')+'">'+r.item_name+'</span><span class="'+(r.quantity>0?'text-seed':'text-red-400')+'">'+r.category+' &times;'+r.quantity+'</span></div>'
    ).join('')+'</div></div>'
  } else { hc.innerHTML='' }

  // Countdown
  const cd=document.getElementById('countdown')
  cd.textContent=data.fetchedAt?'Updated '+countdown(new Date(data.fetchedAt).getTime()+15000):''
}
setInterval(()=>{
  const cd=document.getElementById('countdown')
  if(data?.fetchedAt) cd.textContent='Updated '+countdown(new Date(data.fetchedAt).getTime()+15000)
},1000)
</script>
</body>
</html>
